name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          username: nathnaelashenafi
          show_icons: true
          hide_border: true
          bg_color: 031c16
          title_color: 34D399
          icon_color: 6EE7B7
          text_color: d1fae5
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: anuraghazra/github-readme-stats@master
        with:
          username: nathnaelashenafi
          layout: compact
          hide_border: true
          bg_color: 031c16
          title_color: 34D399
          text_color: d1fae5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=nathnaelashenafi&hide_border=true&background=031c16&stroke=031c16&ring=10B981&fire=34D399&currStreakLabel=6EE7B7&sideLabels=d1fae5&dates=d1fae5&currStreakNum=ECFDF5&sideNums=ECFDF5
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Graph
        uses: ashutosh00710/github-readme-activity-graph@master
        with:
          GH_USERNAME: nathnaelashenafi
          OUTPUT_FILE: profile/activity-graph.svg
          COLOR_PALETTE: github-dark
          TITLE: Contribution Graph

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git commit -m "Update profile statistics" || exit 0

          git push
