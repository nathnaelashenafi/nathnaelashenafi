name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=nathnaelashenafi&show_icons=true&hide_border=true&bg_color=031c16&title_color=34D399&icon_color=6EE7B7&text_color=d1fae5&ring_color=34D399
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=nathnaelashenafi&layout=compact&langs_count=6&hide_border=true&bg_color=031c16&title_color=34D399&text_color=d1fae5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update GitHub profile statistics" || exit 0
          git push
